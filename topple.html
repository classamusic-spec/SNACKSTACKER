<!doctype html>
<!-- TEMPORARY dev entry for the Topple mode. Delete with src/dev/topple-*.ts. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Snackery — Topple (dev)</title>
    <style>
      html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#17101a; -webkit-tap-highlight-color:transparent; }
      body { touch-action:manipulation; -webkit-user-select:none; user-select:none; }
      #gl { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
      #hud {
        position:fixed; left:12px; top:12px; z-index:2; pointer-events:none;
        font:500 13px/1.45 -apple-system, "SF Pro Text", system-ui, sans-serif;
        color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.6); font-variant-numeric:tabular-nums;
      }
      #hud.off { display:none; }
      #hud b { font-size:20px; }
    </style>
  </head>
  <body>
    <canvas id="gl"></canvas>
    <div id="hud"></div>
    <script type="module" src="/src/dev/topple-harness.ts"></script>
  </body>
</html>
